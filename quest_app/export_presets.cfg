[preset.0]

name="Android Quest"
platform="Android"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="../build/quest_hand_stream.apk"

[preset.0.options]

gradle_build/use_gradle_build=true
gradle_build/export_format=0
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
package/unique_name="edu.oregonstate.handstream"
package/name="Hand Stream"
package/signed=true
screen/immersive_mode=true
xr_features/xr_mode=1
xr_features/enable_meta_plugin=true
meta_xr_features/hand_tracking=1
meta_xr_features/quest_2_support=true
meta_xr_features/quest_3_support=true
meta_xr_features/quest_pro_support=true
permissions/internet=true
permissions/access_network_state=true
permissions/access_wifi_state=true
